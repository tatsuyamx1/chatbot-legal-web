<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asesor Legal</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
textarea { width: 100%; height: 90px; padding: .5rem; box-sizing: border-box; }
button { margin-top: .5rem; padding: .6rem 1.2rem; cursor: pointer; }
#respuesta { white-space: pre-wrap; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; min-height: 120px; margin-top: 1rem; }
#fuentes { font-size: .85rem; color: #555; margin-top: .5rem; }
</style>
</head>
<body>
<h3>ALEX · Asesor Legal Educativo</h3>
<p>¡Hola! Soy ALEX, tu asesor legal virtual. Cuéntame tu consulta sobre normativa educativa, laboral, administrativa o de datos personales del Estado de México.</p>
<textarea id="pregunta" placeholder="Escribe tu consulta..."></textarea><br>
<button id="enviar">Consultar</button>
<div id="respuesta"></div>
<div id="fuentes"></div>
<script>
const API_URL = "https://TU-PROYECTO.vercel.app/api/chat"; // cambia por tu URL de Vercel
const APP_TOKEN = "EL_MISMO_APP_TOKEN_DE_VERCEL";

document.getElementById("enviar").onclick = async () => {
  const pregunta = document.getElementById("pregunta").value.trim();
  if (!pregunta) return;
  const salida = document.getElementById("respuesta");
  const fuentes = document.getElementById("fuentes");
  salida.textContent = "Consultando...";
  fuentes.textContent = "";
  try {
    const r = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Token": APP_TOKEN },
      body: JSON.stringify({ pregunta }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Error desconocido");
    salida.textContent = d.respuesta;
    fuentes.textContent = "Fuentes: " + d.fuentes.map((f) => f.norma + (f.articulo ? " — " + f.articulo : "")).join(" | ");
  } catch (e) {
    salida.textContent = "Ocurrió un error: " + e.message;
  }
};
</script>
</body>
</html>
